services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.7
    container_name: ai-operator-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Europe/Amsterdam
      TZ: Europe/Amsterdam
    volumes:
      - ai_operator_n8n_data:/home/node/.n8n

volumes:
  ai_operator_n8n_data:
    name: ai-operator-n8n-data
