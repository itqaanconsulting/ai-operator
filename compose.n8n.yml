services:
  ai-operator-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-operator-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/operator.db
      N8N_TRELLO_WEBHOOK_URL: http://n8n:5678/webhook/ai-operator-trello
      N8N_TRELLO_CANDIDATE_RESULT_WEBHOOK_URL: http://n8n:5678/webhook/ai-operator-candidate-result
      N8N_SHARED_SECRET: ${AI_OPERATOR_WEBHOOK_SECRET}
      GOOGLE_OAUTH_INTERACTIVE: "false"
    volumes:
      - ./operator.db:/data/operator.db
      - ./credentials.json:/app/credentials.json:ro
      - ./token.pickle:/app/token.pickle

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.7
    container_name: ai-operator-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Europe/Amsterdam
      TZ: Europe/Amsterdam
    volumes:
      - ai_operator_n8n_data:/home/node/.n8n

volumes:
  ai_operator_n8n_data:
    name: ai-operator-n8n-data
